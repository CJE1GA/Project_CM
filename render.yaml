services:
  - type: web
    name: project-cm-chatbot
    env: python
    buildCommand: pip install -r .github/chatbot/requirements.txt
    startCommand: gunicorn --chdir .github/chatbot --bind 0.0.0.0:$PORT app:app
    plan: free
    autoDeploy: true
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_TOKEN
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_WORKSHEET_NAME
        value: Leads
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        sync: false